# Deploy the static website (website/) to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The blog (website/blog/) is a Hugo site. Render it and serve the
      # output in its place at /blog/.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
      - name: Build blog
        run: |
          hugo --gc --source website/blog --destination "${{ runner.temp }}/blog-render"
          rm -rf website/blog
          mkdir website/blog
          cp -a "${{ runner.temp }}/blog-render/." website/blog/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
