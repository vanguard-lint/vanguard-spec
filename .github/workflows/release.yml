name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vanguard/go.mod
          cache-dependency-path: vanguard/go.sum
      - name: Build release binaries
        working-directory: vanguard
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p ../dist
          for platform in linux-amd64 windows-amd64 darwin-amd64 darwin-arm64; do
            os="${platform%-*}"
            arch="${platform#*-}"
            out="../dist/vanguard-${version}-${platform}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$out" ./cmd/vanguard
          done
          cd ../dist
          for f in vanguard-*; do sha256sum "$f" > "$f.sha256"; done
      - name: Extract the tag annotation as release notes
        shell: bash
        run: |
          set -euo pipefail
          # .vanguard/rules/versioning.md, "Release notes": the published
          # body is the tag annotation, never a commit message. Read the
          # annotation from the tag object over the API: a lightweight or
          # missing tag fails the run here — there is no fallback path.
          tag_sha="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
          curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
            | jq -er '.message' > release_notes.md
          [ -s release_notes.md ] || { echo "release: no annotation on ${GITHUB_REF_NAME} - refusing to publish" >&2; exit 1; }
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
      - name: Set the release body from the annotation
        shell: bash
        run: |
          set -euo pipefail
          # .vanguard/rules/versioning.md, "Release notes": the body is the
          # tag annotation, set explicitly — the release step above owns
          # binaries only and leaves an existing body untouched.
          release_id="$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" | jq -er '.id')"
          jq -n --rawfile body release_notes.md '{body: $body}' \
            | curl -sf -X PATCH \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -d @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > /dev/null
