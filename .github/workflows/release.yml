name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vanguard/go.mod
          cache-dependency-path: vanguard/go.sum
      - name: Build release binaries
        working-directory: vanguard
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p ../dist
          for platform in linux-amd64 windows-amd64 darwin-amd64 darwin-arm64; do
            os="${platform%-*}"
            arch="${platform#*-}"
            out="../dist/vanguard-${version}-${platform}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$out" ./cmd/vanguard
          done
          cd ../dist
          for f in vanguard-*; do sha256sum "$f" > "$f.sha256"; done
      - name: Extract the tag annotation as release notes
        shell: bash
        run: |
          set -euo pipefail
          git tag -l "${GITHUB_REF_NAME}" --format='%(contents)' > release_notes.md
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body_path: release_notes.md
