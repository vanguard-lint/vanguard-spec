name: go

on:
  push:
    branches: [main]
    paths: ["vanguard/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["vanguard/**", ".github/workflows/go.yml"]

defaults:
  run:
    working-directory: vanguard

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vanguard/go.mod
          cache-dependency-path: vanguard/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -timeout 300s
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: vanguard
