# Vanguard quality criteria tree — epistemic quality decomposition (L0 -> L4).
# Exported from .vanguard/docs/quality-plan.md (sections 2-4) plus the
# lock-integrity branch of docs/designs/lock-integrity-section.en.md (mapped as
# the L2.2.d children). Bound by .vanguard/schemas/criteria-tree.schema.json.
# Status of every node is DRAFT until an adversarial round freezes it (G4: this
# file plus the round log are where Decomposer/Attacker/Referee results live).
schema_version: 1
source: "docs/designs/vanguard-quality-plan.en.md"
nodes:
  # ---------------------------------------------------------------- L0
  - node_id: L0_VANGUARD_INVARIANT
    level: 0
    statement: >
      For every spec document, the status Vanguard reports (fresh, stale, dirty,
      unobserved) is a deterministic and correct function of {vanguard.lock, the
      git tree, the worktree}. Vanguard never reports fresh when the code scope
      or the document itself has changed without being attested.
    justification:
      sufficiency: >-
        Counter-factual test passed: a false-fresh hour means agents code against
        a wrong spec — exactly the silent drift the project exists to prevent.
      necessity: >-
        The value invariant is the reason the tool exists; removing it removes
        the product.
    status: DRAFT
    verification_protocol:
      method: "Counter-factual Test"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L1.1_SEMANTIC_CORRECTNESS, L1.2_STATE_INTEGRITY, L1.3_OPERATIONAL_TIMELINESS, L1.4_AUDITABILITY, L1.5_EXECUTION_CONTAINMENT]

  # ---------------------------------------------------------------- L1
  - node_id: L1.1_SEMANTIC_CORRECTNESS
    level: 1
    parent_id: L0_VANGUARD_INVARIANT
    statement: >-
      Status, attribution and structure-verification results are correct. Errors
      are allowed only in the loud direction.
    justification:
      sufficiency: "Wrong status is the direct violation of L0."
      necessity: "Every other pillar exists to keep this one true under stress."
    status: DRAFT
    verification_protocol:
      method: "Sufficiency/Necessity Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L2.1.a_SCOPE_HASH, L2.1.b_ANCHOR_RESOLUTION, L2.1.c_DIRTY_DETECTION, L2.1.d_DOCUMENT_AND_CLOCK_AXES, L2.1.e_PATH_LOOKUP_AND_ATTRIBUTION, L2.1.f_STRUCTURE_VERIFICATION]

  - node_id: L1.2_STATE_INTEGRITY
    level: 1
    parent_id: L0_VANGUARD_INVARIANT
    statement: >-
      vanguard.lock, store configuration and every hash are not distorted, do
      not lose updates, cannot be silently tampered with, and are identical on
      every machine.
    justification:
      sufficiency: "A distorted lock or config directly produces a wrong status (L1.1)."
      necessity: "The lock is the sole carrier of attestations; without integrity there is no evidence."
    status: DRAFT
    verification_protocol:
      method: "Sufficiency/Necessity Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L2.2.a_LOCK_WRITE_RACES, L2.2.b_SERIALIZATION_PORTABILITY, L2.2.c_LOST_OR_CORRUPT_LOCK, L2.2.d_LOCK_HAND_EDIT_OR_FORGERY, L2.2.e_ENTRY_SHAPE_AND_VERSION, L2.2.f_STORE_CONFIG_TAMPERING]

  - node_id: L1.3_OPERATIONAL_TIMELINESS
    level: 1
    parent_id: L0_VANGUARD_INVARIANT
    statement: >-
      check/observe run offline, deterministically, fast enough, and work
      immediately on a fresh clone or CI.
    justification:
      sufficiency: "A tool that cannot run in CI cannot guard CI."
      necessity: "Offline + deterministic are non-goals NG3/NG4 of the design canon."
    status: DRAFT
    verification_protocol:
      method: "Sufficiency/Necessity Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L2.3.a_CONTAINMENT_LEAK_INTO_HOT_PATH, L2.3.b_PERFORMANCE_BUDGET, L2.3.c_NON_DETERMINISM, L2.3.d_FRESH_CLONE_AND_CI]

  - node_id: L1.4_AUDITABILITY
    level: 1
    parent_id: L0_VANGUARD_INVARIANT
    statement: >-
      Every attestation is visible in git history; every error says what, where,
      and which command next; the envelope is stable for agents.
    justification:
      sufficiency: "Unactionable failures make the loud direction useless."
      necessity: "The envelope is a versioned contract consumed by machines."
    status: DRAFT
    verification_protocol:
      method: "Sufficiency/Necessity Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L2.4.a_ATTESTATION_VISIBILITY, L2.4.b_ACTIONABILITY, L2.4.c_ENVELOPE_AND_EXIT_BITS, L2.4.d_OBSERVE_ABUSE]

  - node_id: L1.5_EXECUTION_CONTAINMENT
    level: 1
    parent_id: L0_VANGUARD_INVARIANT
    statement: >-
      Only --run-bindings and install may run processes or open the network;
      binding results never become staleness.
    justification:
      sufficiency: "A binding failure mixed into stale breaks L1.1 directly; executing processes breaks L1.3 (offline)."
      necessity: "Documents are untrusted input; arbitrary execution through them is the worst-case failure."
    status: DRAFT
    verification_protocol:
      method: "Sufficiency/Necessity Check (attack pre-registered: is this a pillar or a safety property?)"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L2.5.a_BINDING_RESULTS_LEAK, L2.5.b_ARBITRARY_EXECUTION, L2.5.c_BINARY_SUPPLY_CHAIN, L2.5.d_WRITES_OUTSIDE_BOUNDARY]

  # ---------------------------------------------------------------- L1.1
  - node_id: L2.1.a_SCOPE_HASH
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — wrong scope hash"
    statement: "The scope hash fails to distinguish trees that differ, or distinguishes trees that are equal."
    justification:
      sufficiency: "Same net-state => same status; the hash is the net-state input."
      necessity: "Every watch path relies on the hash formula."
    contexts: ["N: dir/** subtree OID, filtered enumeration glob, repository-wide level-1", "E: rename, exec-bit change, symlink retarget, submodule bump (gitlink), brace expansion, consecutive **, scope empty at check time", "Ad: object-format=sha256 repo, shallow clone, non-ASCII/non-UTF-8 path", "Adv: overlapping globs hiding churn; changing a glob's form to change the hash formula"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.1.1.a-1, L4.1.1.a-2, L4.1.1.a-3]

  - node_id: L2.1.b_ANCHOR_RESOLUTION
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — history rewrite"
    statement: "An orphaned or history-shifted anchor makes the status differ between resolution paths."
    justification:
      sufficiency: "Same net-state => same status on the fast, recovery, and fallback paths."
      necessity: "Squash-merge is the common case; without the recovery branch, status is wrong right after every squash."
    contexts: ["N: anchor is an ancestor of HEAD (fast path)", "E: A->B->A (scope changed then reverted)", "Ad: squash-merge orphaned anchor, rebase, cherry-pick, shallow clone, walk exceeding the 1000 bound", "Adv: anchor present in the ODB but not an ancestor"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.1.1.b-1, L4.1.1.b-2, L4.1.1.b-3]

  - node_id: L2.1.c_DIRTY_DETECTION
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — worktree churn misread"
    statement: "Dirty detection reports phantom-fresh (missed churn) or unexplained phantom-dirty."
    justification:
      sufficiency: "The worktree half of the net-state triple."
      necessity: "CRLF/autocrlf environments make naive comparisons wrong on every Windows clone."
    contexts: ["N: edited file in scope, untracked file, gitignored file", "E: CRLF/LF with autocrlf in {true,false,input}, .gitattributes (text, eol, LFS), mode-only change with core.filemode=false", "Ad: blobless clone missing a blob, sparse-checkout, assume-unchanged/skip-worktree, racy-git", "Adv: edit a file then restore its mtime/stat to the old value"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.1.1.c-1, L4.1.1.c-2, L4.1.1.c-3]

  - node_id: L2.1.d_DOCUMENT_AND_CLOCK_AXES
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — document and clock staleness missed"
    statement: "Document edits or review_after expiry do not raise the stale signal, or raise it spuriously."
    justification:
      sufficiency: "Document-changed and review_after are two of the staleness axes."
      necessity: "Narrowing watches or editing an unwatched document are the cheapest ways to fake freshness."
    contexts: ["N: edit content after observe => document_changed", "E: edit frontmatter to narrow watches.paths; edit an observed unwatched document", "Ad: BOM/line-ending/final-newline changes must not count as churn; streamed-hash chunk boundaries", "Adv: hand-edit observed_at; review_after with a skewed clock"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.1.1.d-1, L4.1.1.d-2, L4.1.1.d-3]

  - node_id: L2.1.e_PATH_LOOKUP_AND_ATTRIBUTION
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — wrong reverse lookup or attribution"
    statement: "check --path picks the wrong documents, or range attribution names the wrong commits."
    justification:
      sufficiency: "The decide() procedure and the attribution walk are the only reverse mappings."
      necessity: "Wrong attribution sends the reviewer to the wrong commit."
    contexts: ["N: file vs directory, literal glob", "E: mid-glob **, empty directory, src/*.go vs src/a/b, review_after-only document", "Ad: absolute path outside the target root, ..", "Adv: a valid glob crafted so decide() does not terminate"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.1.1.e-1, L4.1.1.e-2, L4.1.1.e-3]

  - node_id: L2.1.f_STRUCTURE_VERIFICATION
    level: 2
    parent_id: L1.1_SEMANTIC_CORRECTNESS
    dimension: "Failure mechanism — structure rules false-pass or false-fail"
    statement: "Structure verification accepts invalid documents or rejects valid ones."
    justification:
      sufficiency: "Structure results are part of the reported status (L1.1)."
      necessity: "Parser DoS and case-variant duplicate ids are realistic agent-authored inputs."
    contexts: ["N: document conforming to its schema", "E: duplicate frontmatter keys, YAML anchors/aliases, missing schema, id grammar/case-variant duplicates", "Ad: frontmatter > 256 KiB, max_depth > 32, DSL without a leading comment block", "Adv: additionalProperties:false with engine fields; relative link escaping the repository"]
