  - node_id: L2.2.c_LOST_OR_CORRUPT_LOCK
    level: 2
    parent_id: L1.2_STATE_INTEGRITY
    dimension: "Failure mechanism — lost, corrupt, or emptied lock undetected"
    statement: "A missing, truncated, or emptied lock is not reported loudly (with the emptied case as an accepted false-negative under --strict)."
    justification:
      sufficiency: "Without the lock there is no attestation; loud degradation is the design contract."
      necessity: "A fresh clone without the lock must not report green."
    contexts: ["N: valid bootstrap (init, nothing observed) is not reported as lost-lock", "E: valid lock with some documents not yet observed", "Ad: deleted lock, truncated JSON lock, unknown version major", "Adv: lock emptied to {\"docs\":{}} — accepted false-negative"]
    status: DRAFT
