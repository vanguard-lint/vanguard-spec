      necessity: "Team members on Windows and Linux merge lock changes daily."
    contexts: ["N: round-trip", "E: merge two branches that observed different documents", "Ad: Windows autocrlf, NFC/NFD, UTF-16 hashed raw", "Adv: two branches observing the same document"]
