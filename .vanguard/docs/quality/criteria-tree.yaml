    level: 2
    parent_id: L1.2_STATE_INTEGRITY
    dimension: "Failure mechanism — entry shape, mode, or version mismatch"
    statement: "Entries of an unexpected shape or version degrade to unobserved with a hint instead of an internal error, and unknown fields survive."
    justification:
