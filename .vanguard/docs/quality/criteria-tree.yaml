      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.2.2.c-1, L4.2.2.c-2, L4.2.2.c-3, L4.2.2.c-4]

  - node_id: L2.2.d_LOCK_HAND_EDIT_OR_FORGERY
    level: 2
    parent_id: L1.2_STATE_INTEGRITY
    dimension: "Failure mechanism — lock hand-edited or forged (needs ratification: lock-integrity-section.en.md)"
    statement: "Hand-edits and hash forgeries are detected, located, and paired with the command that fixes them; consistent forgery is a stated limit."
    justification:
      sufficiency: "Every divergence between the lock and git truth is exposed; the residue is Risk Register R1."
      necessity: "observe is the only lock writer, but nothing today stops an editor."
    contexts: ["N: lock written by observe, clean commit", "E: hand-edit breaking format (id order, indent, CRLF), missing fields, anchor mixed with scope_snapshot", "Ad: shallow clone missing lock history, HashProvider (no history), merge conflict resolved wrongly", "Adv: forge scope_tree_hash/content_hash/anchor field by field; consistent forgery of every hash; delete an entry to turn stale into unobserved"]
    status: DRAFT
    verification_protocol:
      method: "Orthogonality Check (attack pre-registered: distinct from 2.2.f config tampering?)"
      attacker_rounds_passed: 0
      referee_verdict: PENDING
    children: [L4.2.2.d-1, L4.2.2.d-2, L4.2.2.d-3, L4.2.2.d-4, L4.2.2.d-5, L4.2.2.d-6]

