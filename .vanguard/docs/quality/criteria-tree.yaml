      necessity: "Agents run observe in parallel routinely."
    contexts: ["N: a single observe", "E: two observes on different documents in parallel", "Ad: process killed midway (temp + rename)", "Adv: two observes on the same document"]
    status: DRAFT
    verification_protocol:
