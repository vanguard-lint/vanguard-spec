    level: 2
    parent_id: L1.2_STATE_INTEGRITY
    dimension: "Failure mechanism — store configuration tampered with"
    statement: "vanguard.yaml and schemas/ cannot silently loosen the game's rules, and config changes vs a base ref are visible."
    justification:
