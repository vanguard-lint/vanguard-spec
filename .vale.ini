# Prose linting — terminology enforcement only.
# .vanguard/glossary/glossary.md is the single source of shared terms.
# - accept.txt (Vocab) : required spellings, enforced by Vale.Terms
# - VanguardTerms style: blocks non-standard variants (existence rules)
# Spelling is off: ordinary words are not this check's business.

MinAlertLevel = error

StylesPath = .vale/styles

Vocab = Vanguard

[*.{md}]
BasedOnStyles = Vale, VanguardTerms
Vale.Spelling = NO
