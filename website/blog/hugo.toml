baseURL = 'https://vanguard-lint.github.io/vanguard-spec/blog/'
title = 'Vanguard Blog'

# The blog is rendered standalone, but it borrows the main site's shell
# (top bar, CSS) the same way the osv.dev app shell wraps its blog.
[params]
  homeURL = 'https://vanguard-lint.github.io/vanguard-spec/'
  siteRoot = 'https://vanguard-lint.github.io/vanguard-spec'

[languages]
  [languages.en]
    disableKinds = ['taxonomy', 'term', 'section']

[markup]
  [markup.highlight]
    noClasses = false
    tabWidth = 2
